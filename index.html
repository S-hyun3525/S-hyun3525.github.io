<!-- 2. GitHub 잔디 섹션 -->
<div class="github-contribution" style="margin: 30px 0;">
  <h3>My GitHub Contributions</h3>
  <!-- 아래 이미지 주소의 '본인ID'를 꼭 본인의 깃허브 아이디로 수정하세요! -->
  <a href="https://github.com/본인ID">
    <img src="https://ghchart.rshah.org/2191FB/본인ID" 
         alt="GitHub Contribution Chart" 
         style="width: 100%; max-width: 800px; height: auto; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);" />
  </a>
  <p style="font-size: 0.8em; color: #666; margin-top: 10px;">* 실시간 깃허브 활동 내역입니다.</p>
</div>

<hr>

<!-- 3. 최근 게시물 목록 (Liquid 문법) -->
<div style="margin-top: 40px;">
  <h3>최근 게시물</h3>
  <ul>
    {% for post in site.posts limit:5 %}
      <li style="margin-bottom: 10px;">
        <span style="color: #888;">{{ post.date | date: "%Y-%m-%d" }}</span> - 
        <a href="{{ post.url }}" style="font-weight: bold; text-decoration: none; color: #0366d6;">{{ post.title }}</a>
      </li>
    {% endfor %}
  </ul>
</div>
